frr defaults traditional
hostname r-dmz
!
interface eth1
 ip address 10.0.13.2/30
 ipv6 address 2001:db8:0:13::2/64
 ipv6 ospf6 area 0.0.0.0
!
interface eth2
 ip address 10.0.23.2/30
 ipv6 address 2001:db8:0:23::2/64
 ipv6 ospf6 area 0.0.0.0
!
interface eth3
 ip address 10.10.3.1/24
 ipv6 address 2001:db8:10:3::1/64
 ipv6 ospf6 area 0.0.0.0
!
router ospf
 ospf router-id 3.3.3.3
 network 10.0.13.0/30 area 0
 network 10.0.23.0/30 area 0
 network 10.10.3.0/24 area 0
!
router ospf6
 ospf6 router-id 3.3.3.3
!
