name: projet9

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    # --- ROUTERS (FRRouting) ---
    r-core:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1 # Or quay.io/frrouting/frr:latest for initial network testing
      mgmt-ipv4: 172.20.20.11
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.all.forwarding: 1
      binds:
        - configs/r-core/daemons:/etc/frr/daemons
        - configs/r-core/frr.conf:/etc/frr/frr.conf
      exec:
        - tc qdisc replace dev eth1 root tbf rate 100mbit burst 256kb latency 400ms
        - tc qdisc replace dev eth2 root tbf rate 100mbit burst 256kb latency 400ms

    r-lan:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.20.20.12
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.all.forwarding: 1
      binds:
        - configs/r-lan/daemons:/etc/frr/daemons
        - configs/r-lan/frr.conf:/etc/frr/frr.conf
      exec:
        - tc qdisc replace dev eth1 root tbf rate 100mbit burst 256kb latency 400ms
        - tc qdisc replace dev eth2 root tbf rate 100mbit burst 256kb latency 400ms

    r-dmz:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.20.20.13
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv6.conf.all.disable_ipv6: 0
        net.ipv6.conf.all.forwarding: 1
      binds:
        - configs/r-dmz/daemons:/etc/frr/daemons
        - configs/r-dmz/frr.conf:/etc/frr/frr.conf
      exec:
        - tc qdisc replace dev eth1 root tbf rate 100mbit burst 256kb latency 400ms
        - tc qdisc replace dev eth2 root tbf rate 100mbit burst 256kb latency 400ms

    # --- LINUX BRIDGES ---
    sw-lan:
      kind: bridge
    sw-dmz:
      kind: bridge

    # --- LAN CLIENTS ---
    pc1:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.20.21
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 0
      exec:
        - ip addr add 10.10.1.11/24 dev eth1
        - ip route replace default via 10.10.1.1
        - ip -6 addr add 2001:db8:10:1::11/64 dev eth1
        - ip -6 route replace default via 2001:db8:10:1::1

    pc2:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.20.22
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 0
      exec:
        - ip addr add 10.10.1.12/24 dev eth1
        - ip route replace default via 10.10.1.1
        - ip -6 addr add 2001:db8:10:1::12/64 dev eth1
        - ip -6 route replace default via 2001:db8:10:1::1

    # --- DMZ SERVERS ---
    srv-web:
      kind: linux
      image: nicolaka/netshoot:latest # Or custom nginx + iperf3 image
      mgmt-ipv4: 172.20.20.30
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 0
      exec:
        - ip addr add 10.10.3.10/24 dev eth1
        - ip route replace default via 10.10.3.1
        - ip -6 addr add 2001:db8:10:3::10/64 dev eth1
        - ip -6 route replace default via 2001:db8:10:3::1

    srv-dns:
      kind: linux
      image: internetsystemsconsortium/bind9:9.18
      mgmt-ipv4: 172.20.20.53
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 0
      exec:
        - ip addr add 10.10.3.53/24 dev eth1
        - ip route replace default via 10.10.3.1
        - ip -6 addr add 2001:db8:10:3::53/64 dev eth1
        - ip -6 route replace default via 2001:db8:10:3::1

    # --- EXTERNAL ATTACKER / VISITOR ---
    attacker:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.20.20.66
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 0
      exec:
        - ip addr add 203.0.113.66/24 dev eth1
        - ip route replace default via 203.0.113.1
        - ip -6 addr add 2001:db8:10:9::66/64 dev eth1
        - ip -6 route replace default via 2001:db8:10:9::1

  links:
    # Core Triangle (100 Mbit/s links)
    - endpoints: ["r-core:eth1", "r-lan:eth1"]   # L12
    - endpoints: ["r-core:eth2", "r-dmz:eth1"]   # L13
    - endpoints: ["r-lan:eth2", "r-dmz:eth2"]    # L23
    # External Link
    - endpoints: ["r-core:eth3", "attacker:eth1"]
    # LAN Segment
    - endpoints: ["r-lan:eth3", "sw-lan:eth-lan1"]
    - endpoints: ["pc1:eth1", "sw-lan:eth-lan2"]
    - endpoints: ["pc2:eth1", "sw-lan:eth-lan3"]
    # DMZ Segment
    - endpoints: ["r-dmz:eth3", "sw-dmz:eth-dmz1"]
    - endpoints: ["srv-web:eth1", "sw-dmz:eth-dmz2"]
    - endpoints: ["srv-dns:eth1", "sw-dmz:eth-dmz3"]
